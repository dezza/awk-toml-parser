name: Mirror
permissions:
  actions: write
  contents: write

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source refs
        env:
          SOURCE_URL: https://codeberg.org/dza/${{ github.event.repository.name }}.git
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --mirror "$SOURCE_URL" source.git
          TARGET_URL="https://x-access-token:$GITHUB_TOKEN@github.com/"
          TARGET_URL="$TARGET_URL$GITHUB_REPOSITORY.git"
          git -C source.git push --mirror "$TARGET_URL"
