name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Mirror]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: |
          git -c url.https://codeberg.org/.insteadOf=ssh://git@codeberg.org/ \
            submodule update --init --depth=1 --recursive

      - name: Run tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output=$(mktemp)
          status=0

          "deps/test-framework/src/run.sh" "tests" | tee "$output" || status=$?

          stats=$(awk '
            /^  PASS:/ { passed++ }
            /^TESTS:/ {
              gsub(/,/, "")
              tests = $2
              assertions = $4
              skipped = $6
            }
            /^COVERAGE:/ { coverage = $2 }
            END {
              print passed + 0, tests + 0, assertions + 0, skipped + 0, coverage
            }
          ' "$output")
          set -- $stats
          passed=$1
          tests=$2
          assertions=$3
          skipped=$4
          coverage=${5-}

          {
            printf '## Tests\n\n'
            printf '**%s/%s assertions passed**\n\n' \
              "$passed" "$assertions"
            printf 'Tests: %s · Skipped: %s\n' "$tests" "$skipped"
            [ -z "$coverage" ] || printf 'Coverage: %s\n' "$coverage"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            state=failure
            [ "$status" -eq 0 ] && state=success

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
              -f state="$state" \
              -f context=tests \
              -f description="$passed/$assertions assertions passed" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          exit "$status"
